openapi: 3.1.0
info:
  title: No Excuses local baseline
  version: 1.1.0
paths:
  /health:
    get:
      operationId: getHealth
      responses:
        "200":
          description: Local service health
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /v1/health:
    get:
      operationId: getV1Health
      responses:
        "200":
          description: Versioned local service health
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /v1/account:
    delete:
      operationId: deleteAccount
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeleteAccountRequest" }
      responses:
        "200": { description: Account deleted or idempotently replayed, content: { application/json: { schema: { $ref: "#/components/schemas/DeletedAccountResponse" } } } }
        "400": { $ref: "#/components/responses/ApiError" }
        "401": { $ref: "#/components/responses/ApiError" }
        "403": { $ref: "#/components/responses/ApiError" }
        "409": { $ref: "#/components/responses/ApiError" }
        "500": { $ref: "#/components/responses/ApiError" }
  /v1/workout-check-ins:
    post:
      operationId: submitWorkoutCheckin
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitWorkoutCheckinRequest"
      responses:
        "200":
          description: Check-in accepted or idempotently replayed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmitWorkoutCheckinResponse"
        "400": { $ref: "#/components/responses/ApiError" }
        "401": { $ref: "#/components/responses/ApiError" }
        "403": { $ref: "#/components/responses/ApiError" }
        "409": { $ref: "#/components/responses/ApiError" }
        "500": { $ref: "#/components/responses/ApiError" }
  /v1/groups:
    post:
      operationId: createGroup
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateGroupRequest" }
      responses:
        "200": { description: Group created or idempotently replayed, content: { application/json: { schema: { $ref: "#/components/schemas/GroupMembershipResponse" } } } }
        "400": { $ref: "#/components/responses/ApiError" }
        "401": { $ref: "#/components/responses/ApiError" }
        "403": { $ref: "#/components/responses/ApiError" }
        "409": { $ref: "#/components/responses/ApiError" }
        "500": { $ref: "#/components/responses/ApiError" }
  /v1/group-invitations:
    post:
      operationId: issueGroupInvitation
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IssueGroupInvitationRequest" }
      responses:
        "200": { description: Invitation issued or idempotently replayed, content: { application/json: { schema: { $ref: "#/components/schemas/GroupInvitationResponse" } } } }
        "400": { $ref: "#/components/responses/ApiError" }
        "401": { $ref: "#/components/responses/ApiError" }
        "403": { $ref: "#/components/responses/ApiError" }
        "409": { $ref: "#/components/responses/ApiError" }
        "500": { $ref: "#/components/responses/ApiError" }
  /v1/group-invitations/{invitationId}/revoke:
    post:
      operationId: revokeGroupInvitation
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/InvitationId"
      responses:
        "200": { description: Invitation revoked or idempotently replayed, content: { application/json: { schema: { $ref: "#/components/schemas/RevokedGroupInvitationResponse" } } } }
        "400": { $ref: "#/components/responses/ApiError" }
        "401": { $ref: "#/components/responses/ApiError" }
        "403": { $ref: "#/components/responses/ApiError" }
        "409": { $ref: "#/components/responses/ApiError" }
        "500": { $ref: "#/components/responses/ApiError" }
  /v1/group-invitations/accept:
    post:
      operationId: acceptGroupInvitation
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AcceptGroupInvitationRequest" }
      responses:
        "200": { description: Invitation accepted or idempotently replayed, content: { application/json: { schema: { $ref: "#/components/schemas/GroupMembershipResponse" } } } }
        "400": { $ref: "#/components/responses/ApiError" }
        "401": { $ref: "#/components/responses/ApiError" }
        "403": { $ref: "#/components/responses/ApiError" }
        "409": { $ref: "#/components/responses/ApiError" }
        "500": { $ref: "#/components/responses/ApiError" }
  /v1/group-memberships/leave:
    post:
      operationId: leaveGroup
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      responses:
        "200": { description: Membership ended voluntarily or idempotently replayed, content: { application/json: { schema: { $ref: "#/components/schemas/GroupMembershipResponse" } } } }
        "400": { $ref: "#/components/responses/ApiError" }
        "401": { $ref: "#/components/responses/ApiError" }
        "403": { $ref: "#/components/responses/ApiError" }
        "409": { $ref: "#/components/responses/ApiError" }
        "500": { $ref: "#/components/responses/ApiError" }
  /v1/group-memberships/weekly-target:
    put:
      operationId: setWeeklyTarget
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetWeeklyTargetRequest" }
      responses:
        "200": { description: Weekly target scheduled or idempotently replayed, content: { application/json: { schema: { $ref: "#/components/schemas/WeeklyTargetResponse" } } } }
        "400": { $ref: "#/components/responses/ApiError" }
        "401": { $ref: "#/components/responses/ApiError" }
        "403": { $ref: "#/components/responses/ApiError" }
        "409": { $ref: "#/components/responses/ApiError" }
        "500": { $ref: "#/components/responses/ApiError" }
  /v1/group-memberships/current:
    get:
      operationId: getCurrentGroupMembership
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Authoritative current Group membership, content: { application/json: { schema: { $ref: "#/components/schemas/CurrentGroupMembershipResponse" } } } }
        "400": { $ref: "#/components/responses/ApiError" }
        "401": { $ref: "#/components/responses/ApiError" }
        "500": { $ref: "#/components/responses/ApiError" }
  /v1/member-home:
    get:
      operationId: getMemberHome
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Authorized task-first member Home read model, content: { application/json: { schema: { $ref: "#/components/schemas/MemberHomeResponse" } } } }
        "400": { $ref: "#/components/responses/ApiError" }
        "401": { $ref: "#/components/responses/ApiError" }
        "403": { $ref: "#/components/responses/ApiError" }
        "409": { $ref: "#/components/responses/ApiError" }
        "500": { $ref: "#/components/responses/ApiError" }
  /v1/groups/{groupId}/members/{membershipId}/remove:
    post:
      operationId: removeGroupMember
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/GroupId"
        - $ref: "#/components/parameters/MembershipId"
      responses:
        "200": { description: Membership removed or idempotently replayed, content: { application/json: { schema: { $ref: "#/components/schemas/GroupMembershipResponse" } } } }
        "400": { $ref: "#/components/responses/ApiError" }
        "401": { $ref: "#/components/responses/ApiError" }
        "403": { $ref: "#/components/responses/ApiError" }
        "409": { $ref: "#/components/responses/ApiError" }
        "500": { $ref: "#/components/responses/ApiError" }
  /v1/groups/{groupId}/current-week-progress:
    get:
      operationId: getCurrentWeekProgress
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/GroupId"
      responses:
        "200":
          description: Current Group member targets and check-in counts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentWeekProgressResponse"
        "400": { $ref: "#/components/responses/ApiError" }
        "401": { $ref: "#/components/responses/ApiError" }
        "403": { $ref: "#/components/responses/ApiError" }
        "500": { $ref: "#/components/responses/ApiError" }
  /v1/groups/{groupId}/finalized-weekly-history:
    get:
      operationId: getFinalizedWeeklyHistory
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/GroupId"
      responses:
        "200":
          description: Group history visible under authoritative membership rules
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinalizedWeeklyHistoryResponse"
        "400": { $ref: "#/components/responses/ApiError" }
        "401": { $ref: "#/components/responses/ApiError" }
        "403": { $ref: "#/components/responses/ApiError" }
        "500": { $ref: "#/components/responses/ApiError" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        format: uuid
    GroupId:
      name: groupId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    InvitationId:
      name: invitationId
      in: path
      required: true
      schema: { type: string, format: uuid }
    MembershipId:
      name: membershipId
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    ApiError:
      description: Request, authorization, conflict, or domain failure
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required: [contractVersion, status]
      properties:
        contractVersion:
          type: integer
          enum: [0, 1]
          description: Current and immediately previous baseline wire versions.
        status:
          type: string
          enum: [ok]
    ApiErrorResponse:
      type: object
      additionalProperties: false
      required: [contractVersion, error]
      properties:
        contractVersion: { type: integer, const: 1 }
        error: { $ref: "#/components/schemas/ApiError" }
    ApiError:
      type: object
      additionalProperties: false
      required: [code, message, retryable]
      properties:
        code:
          type: string
          enum: [unauthorized, invalid_request, denied, idempotency_required, idempotency_conflict, domain_failure]
        message: { type: string, minLength: 1, maxLength: 240 }
        retryable: { type: boolean }
    SubmitWorkoutCheckinRequest:
      type: object
      additionalProperties: false
      required: [workoutCheckinId, activityType, completedAt, durationMinutes, perceivedIntensity, selfReportAttested]
      properties:
        workoutCheckinId: { type: string, format: uuid }
        activityType:
          type: string
          enum: [strength, cardio, class, sport, mixed]
        completedAt: { $ref: "#/components/schemas/UtcInstant" }
        durationMinutes: { type: integer, minimum: 1 }
        perceivedIntensity:
          type: string
          enum: [low, moderate, high]
        selfReportAttested: { type: boolean, const: true }
    CreateGroupRequest:
      type: object
      additionalProperties: false
      required: [groupId, membershipId, name, timeZone, weeklyTarget]
      properties:
        groupId: { type: string, format: uuid }
        membershipId: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 80 }
        timeZone: { type: string, minLength: 1, maxLength: 64 }
        weeklyTarget: { type: integer, minimum: 1 }
    IssueGroupInvitationRequest:
      type: object
      additionalProperties: false
      required: [invitationId, email]
      properties:
        invitationId: { type: string, format: uuid }
        email: { type: string, format: email, maxLength: 254 }
    AcceptGroupInvitationRequest:
      type: object
      additionalProperties: false
      required: [token, membershipId, recurringTarget, currentTarget]
      properties:
        token: { type: string, minLength: 1, maxLength: 256 }
        membershipId: { type: string, format: uuid }
        recurringTarget: { type: integer, minimum: 1 }
        currentTarget: { type: integer, minimum: 1 }
    SetWeeklyTargetRequest:
      type: object
      additionalProperties: false
      required: [weeklyTarget]
      properties:
        weeklyTarget: { type: integer, minimum: 1 }
    DeleteAccountRequest:
      type: object
      additionalProperties: false
      required: [confirmation]
      properties:
        confirmation: { type: boolean, const: true }
    DeletedAccountResponse:
      type: object
      additionalProperties: false
      required: [contractVersion, data]
      properties:
        contractVersion: { type: integer, const: 1 }
        data: { $ref: "#/components/schemas/DeletedAccountResult" }
    DeletedAccountResult:
      type: object
      additionalProperties: false
      required: [accountId]
      properties:
        accountId: { type: string, format: uuid }
    WeeklyTargetResponse:
      type: object
      additionalProperties: false
      required: [contractVersion, data]
      properties:
        contractVersion: { type: integer, const: 1 }
        data: { $ref: "#/components/schemas/WeeklyTargetResult" }
    WeeklyTargetResult:
      type: object
      additionalProperties: false
      required: [membershipId, weeklyTarget]
      properties:
        membershipId: { type: string, format: uuid }
        weeklyTarget: { type: integer, minimum: 1 }
    GroupMembershipResponse:
      type: object
      additionalProperties: false
      required: [contractVersion, data]
      properties:
        contractVersion: { type: integer, const: 1 }
        data: { $ref: "#/components/schemas/GroupMembershipResult" }
    GroupMembershipResult:
      type: object
      additionalProperties: false
      required: [membershipId]
      properties:
        membershipId: { type: string, format: uuid }
    CurrentGroupMembershipResponse:
      type: object
      additionalProperties: false
      required: [contractVersion, data]
      properties:
        contractVersion: { type: integer, const: 1 }
        data: { $ref: "#/components/schemas/CurrentGroupMembershipResult" }
    CurrentGroupMembershipResult:
      type: object
      additionalProperties: false
      required: [membership]
      properties:
        membership:
          oneOf:
            - type: object
              additionalProperties: false
              required: [groupId, membershipId]
              properties:
                groupId: { type: string, format: uuid }
                membershipId: { type: string, format: uuid }
            - type: "null"
    MemberHomeResponse:
      type: object
      additionalProperties: false
      required: [contractVersion, data]
      properties:
        contractVersion: { type: integer, const: 1 }
        data: { $ref: "#/components/schemas/MemberHomeResult" }
    MemberHomeResult:
      type: object
      additionalProperties: false
      required: [membershipId, groupId, accountabilityWeekId, weekStatus, lockedTarget, completedWorkoutCount, needsYouCount, friendActivity, seasonStandings, rebuiltAt]
      properties:
        membershipId: { type: string, format: uuid }
        groupId: { type: string, format: uuid }
        accountabilityWeekId: { oneOf: [{ $ref: "#/components/schemas/Uuid" }, { type: "null" }] }
        weekStatus: { oneOf: [{ type: string, enum: [active, provisional, attained, missed, excepted, ended_without_result] }, { type: "null" }] }
        lockedTarget: { oneOf: [{ type: integer, minimum: 1 }, { type: "null" }] }
        completedWorkoutCount: { type: integer, minimum: 0 }
        needsYouCount: { type: integer, minimum: 0 }
        friendActivity:
          type: array
          items: { $ref: "#/components/schemas/MemberHomeFriendActivity" }
        seasonStandings:
          type: array
          items: { $ref: "#/components/schemas/MemberHomeSeasonStanding" }
        rebuiltAt: { $ref: "#/components/schemas/UtcInstant" }
    MemberHomeFriendActivity:
      type: object
      additionalProperties: false
      required: [membershipId, lockedTarget, completedWorkoutCount, weekStatus]
      properties:
        membershipId: { type: string, format: uuid }
        lockedTarget: { oneOf: [{ type: integer, minimum: 1 }, { type: "null" }] }
        completedWorkoutCount: { type: integer, minimum: 0 }
        weekStatus: { oneOf: [{ type: string, enum: [active, provisional, attained, missed, excepted, ended_without_result] }, { type: "null" }] }
    MemberHomeSeasonStanding:
      type: object
      additionalProperties: false
      required: [membershipId, crowns, rank, cochampion]
      properties:
        membershipId: { type: string, format: uuid }
        crowns: { type: integer, minimum: 0 }
        rank: { type: integer, minimum: 1 }
        cochampion: { type: boolean }
    GroupInvitationResponse:
      type: object
      additionalProperties: false
      required: [contractVersion, data]
      properties:
        contractVersion: { type: integer, const: 1 }
        data: { $ref: "#/components/schemas/GroupInvitationResult" }
    GroupInvitationResult:
      type: object
      additionalProperties: false
      required: [invitationId, token, expiresAt]
      properties:
        invitationId: { type: string, format: uuid }
        token: { type: string, minLength: 1, maxLength: 256 }
        expiresAt: { $ref: "#/components/schemas/UtcInstant" }
    RevokedGroupInvitationResponse:
      type: object
      additionalProperties: false
      required: [contractVersion, data]
      properties:
        contractVersion: { type: integer, const: 1 }
        data: { $ref: "#/components/schemas/RevokedGroupInvitationResult" }
    RevokedGroupInvitationResult:
      type: object
      additionalProperties: false
      required: [invitationId, status]
      properties:
        invitationId: { type: string, format: uuid }
        status: { type: string, const: revoked }
    SubmitWorkoutCheckinResponse:
      type: object
      additionalProperties: false
      required: [contractVersion, data]
      properties:
        contractVersion: { type: integer, const: 1 }
        data: { $ref: "#/components/schemas/WorkoutCheckinResult" }
    WorkoutCheckinResult:
      type: object
      additionalProperties: false
      required: [workoutCheckinId, currentWeekCount]
      properties:
        workoutCheckinId: { type: string, format: uuid }
        currentWeekCount: { type: integer, minimum: 1 }
    CurrentWeekProgressResponse:
      type: object
      additionalProperties: false
      required: [contractVersion, data]
      properties:
        contractVersion: { type: integer, const: 1 }
        data:
          type: array
          items: { $ref: "#/components/schemas/CurrentWeekProgressItem" }
    CurrentWeekProgressItem:
      type: object
      additionalProperties: false
      required: [membershipId, lockedTarget, completedWorkoutCount]
      properties:
        membershipId: { type: string, format: uuid }
        lockedTarget: { type: integer, minimum: 1 }
        completedWorkoutCount: { type: integer, minimum: 0 }
    FinalizedWeeklyHistoryResponse:
      type: object
      additionalProperties: false
      required: [contractVersion, data]
      properties:
        contractVersion: { type: integer, const: 1 }
        data:
          type: array
          items: { $ref: "#/components/schemas/FinalizedWeeklyHistoryItem" }
    FinalizedWeeklyHistoryItem:
      type: object
      additionalProperties: false
      required: [membershipId, startsAt, endsAt, lockedTarget, completedWorkoutCount, outcome]
      properties:
        membershipId: { type: string, format: uuid }
        startsAt: { $ref: "#/components/schemas/UtcInstant" }
        endsAt: { $ref: "#/components/schemas/UtcInstant" }
        lockedTarget: { type: integer, minimum: 1 }
        completedWorkoutCount: { type: integer, minimum: 0 }
        outcome:
          type: string
          enum: [attained, missed]
    UtcInstant:
      type: string
      format: date-time
      pattern: "Z$"
    Uuid:
      type: string
      format: uuid
