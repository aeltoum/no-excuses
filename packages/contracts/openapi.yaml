openapi: 3.1.0
info:
  title: No Excuses local baseline
  version: 1.1.0
paths:
  /health:
    get:
      operationId: getHealth
      responses:
        "200":
          description: Local service health
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /v1/health:
    get:
      operationId: getV1Health
      responses:
        "200":
          description: Versioned local service health
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /v1/enrollment:
    post:
      operationId: enrollByInvitation
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/EnrollmentRequest" } } }
      responses:
        "200": { description: Uniform eligibility response, content: { application/json: { schema: { $ref: "#/components/schemas/EnrollmentResponse" } } } }
        "400": { $ref: "#/components/responses/ApiError" }
        "503": { $ref: "#/components/responses/ApiError" }
  /v1/consent:
    post:
      operationId: recordTrueMvpConsent
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ConsentRequest" } } }
      responses:
        "200": { description: Age and pilot/product consent recorded, content: { application/json: { schema: { $ref: "#/components/schemas/ConsentResponse" } } } }
        "400": { $ref: "#/components/responses/ApiError" }
        "401": { $ref: "#/components/responses/ApiError" }
        "403": { $ref: "#/components/responses/ApiError" }
        "503": { $ref: "#/components/responses/ApiError" }
  /v1/account:
    delete:
      operationId: deleteAccount
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeleteAccountRequest" }
      responses:
        "200": { description: Account deleted or idempotently replayed, content: { application/json: { schema: { $ref: "#/components/schemas/DeletedAccountResponse" } } } }
        "202": { description: DB cutoff committed; Auth hard deletion pending retry, content: { application/json: { schema: { $ref: "#/components/schemas/PendingAccountDeletionResponse" } } } }
        "400": { $ref: "#/components/responses/ApiError" }
        "401": { $ref: "#/components/responses/ApiError" }
        "403": { $ref: "#/components/responses/ApiError" }
        "409": { $ref: "#/components/responses/ApiError" }
        "500": { $ref: "#/components/responses/ApiError" }
  /v1/account/display-name:
    get:
      operationId: getAccountDisplayName
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Current Account display name, content: { application/json: { schema: { $ref: "#/components/schemas/AccountDisplayNameResponse" } } } }
        "401": { $ref: "#/components/responses/ApiError" }
        "403": { $ref: "#/components/responses/ApiError" }
        "500": { $ref: "#/components/responses/ApiError" }
    put:
      operationId: setAccountDisplayName
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/SetDisplayNameRequest" } } }
      responses:
        "200": { description: Account display name saved, content: { application/json: { schema: { $ref: "#/components/schemas/AccountDisplayNameResponse" } } } }
        "400": { $ref: "#/components/responses/ApiError" }
        "401": { $ref: "#/components/responses/ApiError" }
        "403": { $ref: "#/components/responses/ApiError" }
        "409": { $ref: "#/components/responses/ApiError" }
        "500": { $ref: "#/components/responses/ApiError" }
  /v1/workout-check-ins:
    post:
      operationId: submitWorkoutCheckin
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitWorkoutCheckinRequest"
      responses:
        "200":
          description: Check-in accepted or idempotently replayed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmitWorkoutCheckinResponse"
        "400": { $ref: "#/components/responses/ApiError" }
        "401": { $ref: "#/components/responses/ApiError" }
        "403": { $ref: "#/components/responses/ApiError" }
        "409": { $ref: "#/components/responses/ApiError" }
        "500": { $ref: "#/components/responses/ApiError" }
  /v1/groups:
    post:
      operationId: createGroup
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateGroupRequest" }
      responses:
        "200": { description: Group created or idempotently replayed, content: { application/json: { schema: { $ref: "#/components/schemas/GroupMembershipResponse" } } } }
        "400": { $ref: "#/components/responses/ApiError" }
        "401": { $ref: "#/components/responses/ApiError" }
        "403": { $ref: "#/components/responses/ApiError" }
        "409": { $ref: "#/components/responses/ApiError" }
        "500": { $ref: "#/components/responses/ApiError" }
  /v1/group-invitations:
    post:
      operationId: issueGroupInvitation
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IssueGroupInvitationRequest" }
      responses:
        "200": { description: Invitation issued or idempotently replayed, content: { application/json: { schema: { $ref: "#/components/schemas/GroupInvitationResponse" } } } }
        "400": { $ref: "#/components/responses/ApiError" }
        "401": { $ref: "#/components/responses/ApiError" }
        "403": { $ref: "#/components/responses/ApiError" }
        "409": { $ref: "#/components/responses/ApiError" }
        "500": { $ref: "#/components/responses/ApiError" }
  /v1/group-invitations/{invitationId}/revoke:
    post:
      operationId: revokeGroupInvitation
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/InvitationId"
      responses:
        "200": { description: Invitation revoked or idempotently replayed, content: { application/json: { schema: { $ref: "#/components/schemas/RevokedGroupInvitationResponse" } } } }
        "400": { $ref: "#/components/responses/ApiError" }
        "401": { $ref: "#/components/responses/ApiError" }
        "403": { $ref: "#/components/responses/ApiError" }
        "409": { $ref: "#/components/responses/ApiError" }
        "500": { $ref: "#/components/responses/ApiError" }
  /v1/group-invitations/accept:
    post:
      operationId: acceptGroupInvitation
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AcceptGroupInvitationRequest" }
      responses:
        "200": { description: Invitation accepted or idempotently replayed, content: { application/json: { schema: { $ref: "#/components/schemas/GroupMembershipResponse" } } } }
        "400": { $ref: "#/components/responses/ApiError" }
        "401": { $ref: "#/components/responses/ApiError" }
        "403": { $ref: "#/components/responses/ApiError" }
        "409": { $ref: "#/components/responses/ApiError" }
        "500": { $ref: "#/components/responses/ApiError" }
  /v1/group-memberships/leave:
    post:
      operationId: leaveGroup
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      responses:
        "200": { description: Membership ended voluntarily or idempotently replayed, content: { application/json: { schema: { $ref: "#/components/schemas/GroupMembershipResponse" } } } }
        "400": { $ref: "#/components/responses/ApiError" }
        "401": { $ref: "#/components/responses/ApiError" }
        "403": { $ref: "#/components/responses/ApiError" }
        "409": { $ref: "#/components/responses/ApiError" }
        "500": { $ref: "#/components/responses/ApiError" }
  /v1/group-memberships/weekly-target:
    put:
      operationId: setWeeklyTarget
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetWeeklyTargetRequest" }
      responses:
        "200": { description: Weekly target scheduled or idempotently replayed, content: { application/json: { schema: { $ref: "#/components/schemas/WeeklyTargetResponse" } } } }
        "400": { $ref: "#/components/responses/ApiError" }
        "401": { $ref: "#/components/responses/ApiError" }
        "403": { $ref: "#/components/responses/ApiError" }
        "409": { $ref: "#/components/responses/ApiError" }
        "500": { $ref: "#/components/responses/ApiError" }
  /v1/group-memberships/current:
    get:
      operationId: getCurrentGroupMembership
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Authoritative current Group membership, content: { application/json: { schema: { $ref: "#/components/schemas/CurrentGroupMembershipResponse" } } } }
        "400": { $ref: "#/components/responses/ApiError" }
        "401": { $ref: "#/components/responses/ApiError" }
        "500": { $ref: "#/components/responses/ApiError" }
  /v1/member-home:
    get:
      operationId: getMemberHome
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Authorized task-first member Home read model, content: { application/json: { schema: { $ref: "#/components/schemas/MemberHomeResponse" } } } }
        "400": { $ref: "#/components/responses/ApiError" }
        "401": { $ref: "#/components/responses/ApiError" }
        "403": { $ref: "#/components/responses/ApiError" }
        "409": { $ref: "#/components/responses/ApiError" }
        "500": { $ref: "#/components/responses/ApiError" }
  /v1/notifications:
    get:
      operationId: getNotifications
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Caller-owned live canonical in-app notifications grouped by read state, content: { application/json: { schema: { $ref: "#/components/schemas/NotificationCenterResponse" } } } }
        "400": { $ref: "#/components/responses/ApiError" }
        "401": { $ref: "#/components/responses/ApiError" }
        "403": { $ref: "#/components/responses/ApiError" }
        "409": { $ref: "#/components/responses/ApiError" }
        "500": { $ref: "#/components/responses/ApiError" }
  /v1/notifications/{notificationId}/open:
    get:
      operationId: openNotification
      security: [{ bearerAuth: [] }]
      parameters:
        - name: notificationId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Live-authorized notification destination or safe recovery route, content: { application/json: { schema: { $ref: "#/components/schemas/NotificationOpenResponse" } } } }
        "400": { $ref: "#/components/responses/ApiError" }
        "401": { $ref: "#/components/responses/ApiError" }
        "500": { $ref: "#/components/responses/ApiError" }
  /v1/social-interactions:
    post:
      operationId: createSocialInteraction
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateSocialInteractionRequest" }
      responses:
        "200": { description: Social interaction created or idempotently replayed, content: { application/json: { schema: { $ref: "#/components/schemas/SocialInteractionResponse" } } } }
        "400": { $ref: "#/components/responses/ApiError" }
        "401": { $ref: "#/components/responses/ApiError" }
        "403": { $ref: "#/components/responses/ApiError" }
        "409": { $ref: "#/components/responses/ApiError" }
        "500": { $ref: "#/components/responses/ApiError" }
  /v1/groups/{groupId}/members/{membershipId}/remove:
    post:
      operationId: removeGroupMember
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/GroupId"
        - $ref: "#/components/parameters/MembershipId"
      responses:
        "200": { description: Membership removed or idempotently replayed, content: { application/json: { schema: { $ref: "#/components/schemas/GroupMembershipResponse" } } } }
        "400": { $ref: "#/components/responses/ApiError" }
        "401": { $ref: "#/components/responses/ApiError" }
        "403": { $ref: "#/components/responses/ApiError" }
        "409": { $ref: "#/components/responses/ApiError" }
        "500": { $ref: "#/components/responses/ApiError" }
  /v1/groups/{groupId}/current-week-progress:
    get:
      operationId: getCurrentWeekProgress
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/GroupId"
      responses:
        "200":
          description: Current Group member targets and check-in counts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentWeekProgressResponse"
        "400": { $ref: "#/components/responses/ApiError" }
        "401": { $ref: "#/components/responses/ApiError" }
        "403": { $ref: "#/components/responses/ApiError" }
        "500": { $ref: "#/components/responses/ApiError" }
  /v1/groups/{groupId}/finalized-weekly-history:
    get:
      operationId: getFinalizedWeeklyHistory
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/GroupId"
      responses:
        "200":
          description: Group history visible under authoritative membership rules
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinalizedWeeklyHistoryResponse"
        "400": { $ref: "#/components/responses/ApiError" }
        "401": { $ref: "#/components/responses/ApiError" }
        "403": { $ref: "#/components/responses/ApiError" }
        "500": { $ref: "#/components/responses/ApiError" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        format: uuid
    GroupId:
      name: groupId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    InvitationId:
      name: invitationId
      in: path
      required: true
      schema: { type: string, format: uuid }
    MembershipId:
      name: membershipId
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    ApiError:
      description: Request, authorization, conflict, or domain failure
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required: [contractVersion, status]
      properties:
        contractVersion:
          type: integer
          enum: [0, 1]
          description: Current and immediately previous baseline wire versions.
        status:
          type: string
          enum: [ok]
    ApiErrorResponse:
      type: object
      additionalProperties: false
      required: [contractVersion, error]
      properties:
        contractVersion: { type: integer, const: 1 }
        error: { $ref: "#/components/schemas/ApiError" }
    ApiError:
      type: object
      additionalProperties: false
      required: [code, message, retryable]
      properties:
        code:
          type: string
          enum: [unauthorized, invalid_request, denied, idempotency_required, idempotency_conflict, domain_failure]
        message: { type: string, minLength: 1, maxLength: 240 }
        retryable: { type: boolean }
    SubmitWorkoutCheckinRequest:
      type: object
      additionalProperties: false
      required: [workoutCheckinId, activityType, completedAt, durationMinutes, perceivedIntensity, selfReportAttested]
      properties:
        workoutCheckinId: { type: string, format: uuid }
        activityType:
          type: string
          enum: [strength, cardio, class, sport, mixed]
        completedAt: { $ref: "#/components/schemas/UtcInstant" }
        durationMinutes: { type: integer, minimum: 1 }
        perceivedIntensity:
          type: string
          enum: [low, moderate, high]
        selfReportAttested: { type: boolean, const: true }
    CreateGroupRequest:
      type: object
      additionalProperties: false
      required: [groupId, membershipId, name, timeZone, weeklyTarget]
      properties:
        groupId: { type: string, format: uuid }
        membershipId: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 80 }
        timeZone: { type: string, minLength: 1, maxLength: 64 }
        weeklyTarget: { type: integer, minimum: 1 }
    IssueGroupInvitationRequest:
      type: object
      additionalProperties: false
      required: [invitationId, email]
      properties:
        invitationId: { type: string, format: uuid }
        email: { type: string, format: email, maxLength: 254 }
    AcceptGroupInvitationRequest:
      type: object
      additionalProperties: false
      required: [token, membershipId, recurringTarget, currentTarget]
      properties:
        token: { type: string, minLength: 1, maxLength: 256 }
        membershipId: { type: string, format: uuid }
        recurringTarget: { type: integer, minimum: 1 }
        currentTarget: { type: integer, minimum: 1 }
    SetWeeklyTargetRequest:
      type: object
      additionalProperties: false
      required: [weeklyTarget]
      properties:
        weeklyTarget: { type: integer, minimum: 1 }
    DeleteAccountRequest:
      type: object
      additionalProperties: false
      required: [confirmation, otpCode]
      properties:
        confirmation: { type: boolean, const: true }
        otpCode: { type: string, pattern: '^[0-9]{6}$', description: 'Fresh email code required by active PWA API' }
    SetDisplayNameRequest:
      type: object
      additionalProperties: false
      required: [displayName]
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 40
          pattern: '^\S(?:[\s\S]*\S)?$'
    AccountDisplayNameResponse:
      type: object
      additionalProperties: false
      required: [contractVersion, data]
      properties:
        contractVersion: { type: integer, const: 1 }
        data:
          type: object
          additionalProperties: false
          required: [displayName]
          properties:
            displayName:
              oneOf:
                - { type: string, minLength: 1, maxLength: 40 }
                - { type: "null" }
    EnrollmentRequest:
      type: object
      additionalProperties: false
      required: [email, token]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        token: { type: string, minLength: 1, maxLength: 256 }
    EnrollmentResponse:
      type: object
      additionalProperties: false
      required: [contractVersion, data]
      properties:
        contractVersion: { type: integer, const: 1 }
        data:
          type: object
          additionalProperties: false
          required: [message]
          properties:
            message: { type: string, const: "If invitation is eligible, request a sign-in code." }
    ConsentRequest:
      type: object
      additionalProperties: false
      required: [adult, pilot, product]
      properties:
        adult: { type: boolean, const: true }
        pilot: { type: boolean, const: true }
        product: { type: boolean, const: true }
    ConsentResponse:
      type: object
      additionalProperties: false
      required: [contractVersion, data]
      properties:
        contractVersion: { type: integer, const: 1 }
        data:
          type: object
          additionalProperties: false
          required: [accepted]
          properties:
            accepted: { type: boolean, const: true }
    CreateSocialInteractionRequest:
      oneOf:
        - type: object
          additionalProperties: false
          required: [interactionId, recipientMembershipId, kind, body]
          properties:
            interactionId: { type: string, format: uuid }
            recipientMembershipId: { type: string, format: uuid }
            kind: { type: string, const: reaction }
            body: { type: string, enum: [strong, fire, cheer] }
        - type: object
          additionalProperties: false
          required: [interactionId, recipientMembershipId, kind, body]
          properties:
            interactionId: { type: string, format: uuid }
            recipientMembershipId: { type: string, format: uuid }
            kind: { type: string, const: message }
            body:
              type: string
              minLength: 1
              maxLength: 280
              pattern: '^\S(?:[\s\S]*\S)?$'
              description: Canonical message without surrounding whitespace.
    SocialInteractionResponse:
      type: object
      additionalProperties: false
      required: [contractVersion, data]
      properties:
        contractVersion: { type: integer, const: 1 }
        data: { $ref: "#/components/schemas/SocialInteractionResult" }
    SocialInteractionResult:
      type: object
      additionalProperties: false
      required: [interactionId]
      properties:
        interactionId: { type: string, format: uuid }
    DeletedAccountResponse:
      type: object
      additionalProperties: false
      required: [contractVersion, data]
      properties:
        contractVersion: { type: integer, const: 1 }
        data: { $ref: "#/components/schemas/DeletedAccountResult" }
    PendingAccountDeletionResponse:
      type: object
      additionalProperties: false
      required: [contractVersion, data]
      properties:
        contractVersion: { type: integer, const: 1 }
        data:
          type: object
          additionalProperties: false
          required: [accountId, authDeletion]
          properties:
            accountId: { type: string, format: uuid }
            authDeletion: { type: string, const: pending }
    DeletedAccountResult:
      type: object
      additionalProperties: false
      required: [accountId]
      properties:
        accountId: { type: string, format: uuid }
    WeeklyTargetResponse:
      type: object
      additionalProperties: false
      required: [contractVersion, data]
      properties:
        contractVersion: { type: integer, const: 1 }
        data: { $ref: "#/components/schemas/WeeklyTargetResult" }
    WeeklyTargetResult:
      type: object
      additionalProperties: false
      required: [membershipId, weeklyTarget]
      properties:
        membershipId: { type: string, format: uuid }
        weeklyTarget: { type: integer, minimum: 1 }
    GroupMembershipResponse:
      type: object
      additionalProperties: false
      required: [contractVersion, data]
      properties:
        contractVersion: { type: integer, const: 1 }
        data: { $ref: "#/components/schemas/GroupMembershipResult" }
    GroupMembershipResult:
      type: object
      additionalProperties: false
      required: [membershipId]
      properties:
        membershipId: { type: string, format: uuid }
    CurrentGroupMembershipResponse:
      type: object
      additionalProperties: false
      required: [contractVersion, data]
      properties:
        contractVersion: { type: integer, const: 1 }
        data: { $ref: "#/components/schemas/CurrentGroupMembershipResult" }
    CurrentGroupMembershipResult:
      type: object
      additionalProperties: false
      required: [membership]
      properties:
        membership:
          oneOf:
            - type: object
              additionalProperties: false
              required: [groupId, membershipId]
              properties:
                groupId: { type: string, format: uuid }
                membershipId: { type: string, format: uuid }
            - type: "null"
    MemberHomeResponse:
      type: object
      additionalProperties: false
      required: [contractVersion, data]
      properties:
        contractVersion: { type: integer, const: 1 }
        data: { $ref: "#/components/schemas/MemberHomeResult" }
    MemberHomeResult:
      type: object
      additionalProperties: false
      required: [membershipId, groupId, accountabilityWeekId, weekStatus, lockedTarget, completedWorkoutCount, needsYouCount, friendActivity, seasonStandings, rebuiltAt]
      properties:
        membershipId: { type: string, format: uuid }
        groupId: { type: string, format: uuid }
        accountabilityWeekId: { oneOf: [{ $ref: "#/components/schemas/Uuid" }, { type: "null" }] }
        weekStatus: { oneOf: [{ type: string, enum: [active, provisional, attained, missed, excepted, ended_without_result] }, { type: "null" }] }
        lockedTarget: { oneOf: [{ type: integer, minimum: 1 }, { type: "null" }] }
        completedWorkoutCount: { type: integer, minimum: 0 }
        needsYouCount: { type: integer, minimum: 0 }
        friendActivity:
          type: array
          items: { $ref: "#/components/schemas/MemberHomeFriendActivity" }
        seasonStandings:
          type: array
          items: { $ref: "#/components/schemas/MemberHomeSeasonStanding" }
        rebuiltAt: { $ref: "#/components/schemas/UtcInstant" }
    MemberHomeFriendActivity:
      type: object
      additionalProperties: false
      required: [membershipId, lockedTarget, completedWorkoutCount, weekStatus]
      properties:
        membershipId: { type: string, format: uuid }
        lockedTarget: { oneOf: [{ type: integer, minimum: 1 }, { type: "null" }] }
