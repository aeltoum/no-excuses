project_id = "no-excuses-local"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "noexcuses://local"
additional_redirect_urls = ["noexcuses://local/**"]
enable_signup = false

[auth.email.template.magic_link]
subject = "Your No Excuses sign-in code"
content_path = "./supabase/templates/magic_link.html"

[storage]
enabled = true
file_size_limit = "10MiB"

[analytics]
enabled = false
