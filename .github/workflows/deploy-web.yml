name: Deploy production

# Production now deploys through Cloudflare (scripts/deploy-production.sh, run by
# Cloudflare Workers Builds or `pnpm release`). This workflow stays as a manual fallback.
on:
  workflow_dispatch:

# All production mutations share one lock. Never cancel an applying migration.
concurrency:
  group: production-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check release configuration
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: |
          for key in SUPABASE_DB_URL CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID VITE_API_BASE_URL VITE_SUPABASE_URL VITE_SUPABASE_ANON_KEY; do
            if [ -z "${!key}" ]; then echo "Missing configuration: $key"; exit 1; fi
          done
      - run: pnpm check
      - run: pnpm api:build
      - name: Build web before changing production
        run: pnpm --filter @no-excuses/web build
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      - name: Bundle API Worker before database changes
        run: pnpm api:deploy --dry-run --outdir "$RUNNER_TEMP/api-worker"
      - name: Apply committed forward migrations
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          pnpm exec supabase migration list --db-url "$SUPABASE_DB_URL"
          pnpm exec supabase db push --db-url "$SUPABASE_DB_URL" --dry-run
          pnpm exec supabase db push --db-url "$SUPABASE_DB_URL" --yes
          pnpm exec supabase migration list --db-url "$SUPABASE_DB_URL"
      - name: Deploy exact API commit to Cloudflare Workers
        run: pnpm api:deploy --message "${{ github.sha }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      - name: Check API health
        env:
          API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: |
          curl --fail --silent --show-error --max-time 90 --retry 2 "$API_BASE_URL/v1/health" > /tmp/health.json
          node --input-type=module -e 'import {readFileSync} from "node:fs"; const result = JSON.parse(readFileSync("/tmp/health.json", "utf8")); if (result.status !== "ok") throw new Error("API health failed");'
      - name: Publish web only after database and API succeed
        run: >-
          pnpm exec wrangler pages deploy apps/web/dist
          --project-name no-excuses --branch main
          --commit-hash ${{ github.sha }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
