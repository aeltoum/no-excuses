name: Repair migration history

# Manual-only. Marks migrations already present in the hosted database as applied in
# Supabase's migration history, so `db push` stops re-running them. Never runs migration SQL.
# Applied state comes from app_private.schema_versions; a file that records no version counts
# as applied when a later file's version is applied.
on:
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Mark applied migrations
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          max=$(psql "$SUPABASE_DB_URL" -Atc "select coalesce(max(version), 0) from app_private.schema_versions")
          echo "Highest applied schema version: $max"
          applied=() queued=()
          for f in supabase/migrations/*.sql; do
            ts=$(basename "$f" | cut -d_ -f1)
            v=$(grep -oE "schema_versions \(version\) values \([0-9]+\)" "$f" | grep -oE "[0-9]+" || true)
            if [ -z "$v" ]; then queued+=("$ts"); continue; fi
            if [ "$v" -le "$max" ]; then applied+=("${queued[@]}" "$ts"); fi
            queued=()
          done
          if [ ${#applied[@]} -eq 0 ]; then echo "Nothing to mark."; exit 0; fi
          echo "Marking applied: ${applied[*]}"
          pnpm exec supabase migration repair --db-url "$SUPABASE_DB_URL" --status applied "${applied[@]}"
      - name: Pending migrations after repair
        run: pnpm exec supabase db push --db-url "$SUPABASE_DB_URL" --dry-run
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
