name: Repair migration history

# One-time reconciliation of two verified manually applied migrations. Never
# infer application from max(schema_versions), and never execute migration SQL.
on:
  workflow_dispatch:

concurrency:
  group: production-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  repair:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Disable independent Render Auto-Deploy once
        run: node scripts/deploy-render.mjs --disable-auto-deploy
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ vars.RENDER_SERVICE_ID }}
      - name: Verify exact schema, grants, data invariant, and history
        run: node scripts/verify-migration-history.mjs --database
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      - name: Reconcile only the verified October 17 and 18 entries
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          pnpm exec supabase migration repair --db-url "$SUPABASE_DB_URL" --status applied 20261017000000 20261018000000
          pnpm exec supabase migration list --db-url "$SUPABASE_DB_URL"
          pnpm exec supabase db push --db-url "$SUPABASE_DB_URL" --dry-run
